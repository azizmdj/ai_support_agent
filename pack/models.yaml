# Model providers. Keys never live here: api_key_env names the environment variable that holds one.
# routing.default is the ordered fallback chain. TRIAGE_PROVIDER=id1,id2 overrides it for one run.
# Every call to a non-fake provider receives masked text only (see src/triage_agent/masking.py).
providers:
  - id: fake
    kind: fake            # deterministic keyword classifier, offline

  - id: openai_main
    kind: openai_compatible
    base_url: https://api.openai.com/v1
    model: gpt-4o-mini    # change to the model your organization has approved
    api_key_env: OPENAI_API_KEY

  - id: anthropic_alt
    kind: anthropic
    base_url: https://api.anthropic.com
    model: claude-opus-5-5   # placeholder: change to your approved model (e.g. claude-haiku-5-5 for lower cost)
    api_key_env: ANTHROPIC_API_KEY

  - id: local
    kind: openai_compatible
    base_url: http://localhost:11434/v1   # Ollama; vLLM and others work the same way
    model: llama3.1          # whatever model the local server has pulled

routing:
  default: [fake]

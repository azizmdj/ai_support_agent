[project]
name = "triage-agent"
version = "0.1.0"
description = "Support triage agent for a bank: rules, LLM classification, approved templates, human approval gate."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "pydantic>=2.6",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
